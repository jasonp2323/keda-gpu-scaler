# Drives the GPU to ~100% utilization for a couple of minutes so KEDA scales
# `demo-app` up. Requests one GPU (nvidia.com/gpu: 1), advertised by the
# minikube nvidia-device-plugin.
#
# NOTE: gpu-burn is a community image; swap `image`/`args` for any GPU
# workload if it's unavailable — the scaler reads GPU utilization globally, so
# any load works.
apiVersion: batch/v1
kind: Job
metadata:
  name: gpu-burn
  namespace: default
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: gpu-burn
    spec:
      restartPolicy: Never
      containers:
        - name: gpu-burn
          image: docker.io/oguzpastirmaci/gpu-burn:latest
          args: ["150"] # burn for 150 seconds
          resources:
            limits:
              nvidia.com/gpu: 1
