name: Draft PDF

# Compiles the JOSS paper (paper/paper.md) into a PDF so we can verify it
# builds before submitting, and download the artifact for review.

on:
  push:
    paths:
      - 'paper/**'
      - '.github/workflows/draft-pdf.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build draft PDF
        uses: openjournals/openjournals-draft-action@85a18372e48f551d8af9ddb7a747de685fbbb01c # master
        with:
          journal: joss
          paper-path: paper/paper.md

      - name: Upload PDF artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: joss-paper
          path: paper/paper.pdf
