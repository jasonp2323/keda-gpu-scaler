# Burns the GPU for ~150s (requesting one GPU) so you can watch KEDA scale
# `demo-app` up. Swap `image`/`args` for any other GPU-busy workload if this
# community "gpu-burn" image is unavailable.
apiVersion: batch/v1
kind: Job
metadata:
  name: gpu-burn
  namespace: default
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: gpu-burn
    spec:
      restartPolicy: Never
      containers:
        - name: gpu-burn
          image: docker.io/oguzpastirmaci/gpu-burn:latest
          args: ["150"] # burn for 150 seconds
          resources:
            limits:
              nvidia.com/gpu: 1
