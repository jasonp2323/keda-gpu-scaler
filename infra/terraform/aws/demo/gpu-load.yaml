# Drives the GPU to ~100% utilization for a few minutes so KEDA scales
# `demo-app` up; requests one GPU (nvidia.com/gpu: 1). Uses a community
# "gpu-burn" image — swap image/args for any other GPU workload if unavailable.
apiVersion: batch/v1
kind: Job
metadata:
  name: gpu-burn
  namespace: default
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: gpu-burn
    spec:
      restartPolicy: Never
      containers:
        - name: gpu-burn
          image: docker.io/oguzpastirmaci/gpu-burn:latest
          args: ["150"] # burn for 150 seconds
          resources:
            limits:
              nvidia.com/gpu: 1
